<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RosterView Control Room</title>
<style>
/* The owner's view of RosterView. Desktop first: this is read on a Mac, beside
   the phone, not on it. Nothing here grants anything — every number comes
   from an admin_cr_* function that checks is_admin() on the server. */
:root{
  color-scheme:light;
  --bg:#f3f4f6; --card:#ffffff; --ink:#0b0d12; --sub:#5b6270; --faint:#9aa1ab; --line:rgba(12,16,24,.08); --fill:#eef0f3;
  --accent:#2a78d6; --accent-ink:#1f5fae; --accent-soft:rgba(42,120,214,.12);
  --good:#0ca30c; --good-ink:#0a7a0a; --warn:#fab219; --warn-ink:#8a5a00; --bad:#d03b3b; --bad-ink:#b02c2c;
  --series:#2a78d6; --series-bad:#d03b3b; --grid:rgba(12,16,24,.07);
  --shadow:0 1px 0 rgba(12,16,24,.04), 0 12px 28px -20px rgba(12,16,24,.35);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#0a0c10; --card:#15171c; --ink:#f3f4f6; --sub:#a1a8b3; --faint:#636a75; --line:rgba(255,255,255,.08); --fill:#1f2228;
    --accent:#3987e5; --accent-ink:#7db3f2; --accent-soft:rgba(57,135,229,.18);
    --good-ink:#4fd14f; --warn-ink:#fab219; --bad-ink:#ff8a8a; --series:#3987e5; --grid:rgba(255,255,255,.07);
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0c10; --card:#15171c; --ink:#f3f4f6; --sub:#a1a8b3; --faint:#636a75; --line:rgba(255,255,255,.08); --fill:#1f2228;
  --accent:#3987e5; --accent-ink:#7db3f2; --accent-soft:rgba(57,135,229,.18);
  --good-ink:#4fd14f; --warn-ink:#fab219; --bad-ink:#ff8a8a; --series:#3987e5; --grid:rgba(255,255,255,.07);
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; letter-spacing:-.005em}
button,input,select{font:inherit; color:inherit}
.wrap{max-width:1440px; margin:0 auto; padding:18px 24px 60px}
header{display:flex; align-items:center; gap:14px; margin-bottom:16px}
header h1{margin:0; font-size:20px; font-weight:800; letter-spacing:-.4px}
header .live{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:650; color:var(--sub)}
.dot{width:8px; height:8px; border-radius:50%; background:var(--good); display:inline-block; flex:none}
.dot.off{background:var(--faint)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
.live .dot{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){ .live .dot{animation:none} }
header .sp{flex:1}
.btn{appearance:none; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:7px 12px; font-weight:650; font-size:13px; cursor:pointer}
.btn:hover{background:var(--fill)}
.btn.primary{background:var(--ink); color:var(--card); border-color:transparent}
.demo{font-size:12px; font-weight:700; color:var(--warn-ink); background:color-mix(in srgb,var(--warn) 18%,transparent); padding:3px 9px; border-radius:999px}

/* the layout */
.grid{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:14px}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:16px 18px; min-width:0}
.card h2{margin:0 0 2px; font-size:14px; font-weight:750; letter-spacing:-.1px}
.card .cap{font-size:12px; color:var(--sub); margin-bottom:12px}
.c3{grid-column:span 3} .c4{grid-column:span 4} .c5{grid-column:span 5} .c6{grid-column:span 6} .c7{grid-column:span 7} .c8{grid-column:span 8} .c12{grid-column:span 12}
@media (max-width:1100px){ .c3,.c4,.c5{grid-column:span 6} .c7,.c8{grid-column:span 12} }
@media (max-width:720px){ .wrap{padding:14px 16px 40px} .c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12} }

/* the numbers */
.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
.kpi{padding:12px 14px; border-radius:12px; background:var(--fill); min-width:0}
.kpi b{display:block; font-size:28px; font-weight:800; letter-spacing:-.8px; line-height:1.1; font-variant-numeric:tabular-nums}
.kpi span{display:flex; align-items:center; gap:6px; margin-top:3px; font-size:12px; font-weight:650; color:var(--sub)}
.kpi.bad b{color:var(--bad-ink)}
@media (max-width:720px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* the app, first screen to last */
.map{display:flex; flex-direction:column; gap:2px}
.mapr{display:grid; grid-template-columns:18px minmax(0,1fr) auto auto; align-items:center; gap:10px; padding:6px 8px; border-radius:9px; cursor:pointer; border:none; background:transparent; text-align:left}
.mapr:hover{background:var(--fill)}
.mapr.on{background:var(--accent-soft)}
.mapr i{font-style:normal; width:18px; height:18px; border-radius:50%; display:grid; place-items:center; font-size:10.5px; font-weight:800; color:var(--sub); background:var(--fill)}
.mapr .nm{font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mapr .now{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color:var(--good-ink); min-width:42px; justify-content:flex-end; font-variant-numeric:tabular-nums}
.mapr .now.zero{color:var(--faint); font-weight:600}
.mapr .wk{font-size:12px; color:var(--sub); min-width:66px; text-align:right; font-variant-numeric:tabular-nums}
.maphd{display:grid; grid-template-columns:18px minmax(0,1fr) auto auto; gap:10px; padding:0 8px 6px; font-size:11px; font-weight:700; color:var(--faint)}
.maphd span:nth-child(3){min-width:42px; text-align:right} .maphd span:nth-child(4){min-width:66px; text-align:right}

/* charts */
.chart{position:relative}
.chart svg{display:block; width:100%; height:auto; overflow:visible}
.chart .ax{font-size:10.5px; fill:var(--faint)}
.chart .gl{stroke:var(--grid); stroke-width:1}
.chart .hit{fill:transparent; cursor:default}
.tip{position:fixed; z-index:50; pointer-events:none; background:var(--ink); color:var(--card); font-size:12px; font-weight:600; padding:6px 9px;
  border-radius:8px; white-space:nowrap; transform:translate(-50%,-120%); display:none; box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.tip b{font-weight:800}
.hbars{display:flex; flex-direction:column; gap:7px}
.hb{display:grid; grid-template-columns:130px minmax(0,1fr) 64px; align-items:center; gap:10px; font-size:12.5px}
.hb .l{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--sub); font-weight:600}
.hb .t{height:12px; border-radius:0 4px 4px 0; background:var(--fill); overflow:hidden}
.hb .t i{display:block; height:100%; background:var(--series); border-radius:0 4px 4px 0}
.hb .v{text-align:right; font-weight:700; font-variant-numeric:tabular-nums}
.tabs{display:flex; gap:2px; padding:3px; border-radius:10px; background:var(--fill); width:max-content; margin-bottom:12px}
.tabs button{border:none; background:transparent; padding:5px 11px; border-radius:8px; font-size:12.5px; font-weight:650; color:var(--sub); cursor:pointer}
.tabs button.on{background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* tables and lists */
table{width:100%; border-collapse:collapse; font-size:13px}
th{text-align:left; font-size:11px; font-weight:700; color:var(--faint); padding:0 10px 8px 0; white-space:nowrap}
td{padding:8px 10px 8px 0; border-top:1px solid var(--line); vertical-align:top}
td.num, th.num{text-align:right; font-variant-numeric:tabular-nums}
tr.tap{cursor:pointer} tr.tap:hover td{background:var(--fill)}
.who{font-weight:700} .muted{color:var(--sub)} .faint{color:var(--faint)}
.tag{display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; background:var(--fill); color:var(--sub); white-space:nowrap}
.tag.bad{color:var(--bad-ink); background:color-mix(in srgb,var(--bad) 12%,transparent)}
.tag.good{color:var(--good-ink); background:color-mix(in srgb,var(--good) 12%,transparent)}
.tag.warn{color:var(--warn-ink); background:color-mix(in srgb,var(--warn) 18%,transparent)}
.tag.acc{color:var(--accent-ink); background:var(--accent-soft)}
.scroll{max-height:440px; overflow:auto; margin:0 -4px; padding:0 4px}
.empty{padding:22px 0; text-align:center; color:var(--faint); font-size:13px}
.feed{display:flex; flex-direction:column}
.ev{display:grid; grid-template-columns:62px 18px minmax(0,1fr); gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:13px}
.ev:first-child{border-top:none}
.ev time{font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums; padding-top:1px}
.ev .k{width:18px; height:18px; border-radius:6px; display:grid; place-items:center; font-size:10px; font-weight:800; background:var(--fill); color:var(--sub)}
.ev .k.bad{background:color-mix(in srgb,var(--bad) 14%,transparent); color:var(--bad-ink)}
.ev .k.good{background:color-mix(in srgb,var(--good) 14%,transparent); color:var(--good-ink)}
.ev .k.acc{background:var(--accent-soft); color:var(--accent-ink)}
.ev .d{min-width:0} .ev .d small{display:block; color:var(--sub); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.filters input[type=search]{min-width:min(340px,100%)}
.filters select,.filters input{border:1px solid var(--line); background:var(--card); border-radius:9px; padding:6px 9px; font-size:12.5px}
.need{display:flex; flex-direction:column; gap:8px}
.ni{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:12px; background:var(--fill)}
.ni b{display:block; font-size:13.5px} .ni span{font-size:12.5px; color:var(--sub)}
.ni .dot{margin-top:6px}
.bug b{font-size:13px; font-family:ui-monospace,Menlo,monospace; font-weight:600; word-break:break-word}

/* the pilot drawer */
.drawer{position:fixed; inset:0 0 0 auto; width:min(520px,100vw); background:var(--card); border-left:1px solid var(--line);
  box-shadow:-20px 0 50px -20px rgba(0,0,0,.35); z-index:40; transform:translateX(102%); transition:transform .25s cubic-bezier(.2,.7,.3,1);
  display:flex; flex-direction:column}
.drawer.open{transform:none}
.drawer .hd{display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line)}
.drawer .hd h3{margin:0; font-size:17px; flex:1}
.drawer .bd{padding:14px 18px 30px; overflow:auto}
.facts{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:14px}
.facts div{background:var(--fill); border-radius:10px; padding:9px 11px}
.facts b{display:block; font-size:16px; font-weight:800; font-variant-numeric:tabular-nums}
.facts span{font-size:11.5px; color:var(--sub); font-weight:600}

/* signing in */
.gate{max-width:380px; margin:12vh auto; text-align:center}
.gate h1{font-size:24px; margin:0 0 6px}
.gate p{color:var(--sub); margin:0 0 20px}
.gate form{display:flex; flex-direction:column; gap:10px; text-align:left}
.gate input{border:1px solid var(--line); background:var(--card); border-radius:12px; padding:12px 13px; font-size:15px}
.gate .btn{padding:12px; font-size:15px}
.gate .err{color:var(--bad-ink); font-size:13px; min-height:18px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="tip" id="tip" role="tooltip"></div>
<div id="root"></div>

<script>
/* ============================================================================
   CONFIG — the same public project address and key as the app. The key is
   the public one; what protects the data is the server: every admin_cr_*
   function checks is_admin() itself.
   ========================================================================= */
const SB_URL="https://hmvxpkihiohylpwvtfqv.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhtdnhwa2loaW9oeWxwd3Z0ZnF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMzUzOTIsImV4cCI6MjEwMjgxMTM5Mn0.OE7D-yP42NAcCg7vF0h1368d1CNN5HEJhKmaJdlkvjk";
const SESS_KEY="rvcr_session";
const DEMO = /(^|[#?&])demo\b/.test(location.hash+location.search);

/* The app, first screen to last, in the order a new pilot meets it. `view` is
   what the app sends when that screen opens. */
const SCREENS=[
  {view:"gate",    name:"Sign in / sign up"},
  {view:"import",  name:"Import sheet"},
  {view:"portal",  name:"Airline roster page"},
  {view:"month",   name:"Month"},
  {view:"list",    name:"List"},
  {view:"crew",    name:"Crew"},
  {view:"pilot",   name:"A colleague's roster"},
  {view:"compare", name:"Compare"},
  {view:"swap",    name:"Swap"},
  {view:"log",     name:"Logbook"},
  {view:"proof",   name:"Original"},
  {view:"settings",name:"Profile & settings"}
];
const SCREEN_NAME=Object.fromEntries(SCREENS.map(s=>[s.view,s.name]));

/* What each record means, in words. */
const KINDS={
  app_open:        {t:"Opened the app",                k:"",   i:"↗"},
  view:            {t:"Opened",                        k:"",   i:"›"},
  signup:          {t:"Signed up",                     k:"good",i:"+"},
  signin:          {t:"Signed in",                     k:"",   i:"→"},
  signout:         {t:"Signed out",                    k:"",   i:"←"},
  roster_import:   {t:"Imported a roster",             k:"good",i:"✓"},
  import_empty:    {t:"Import found no duties",        k:"bad",i:"!"},
  import_failed:   {t:"Import failed",                 k:"bad",i:"!"},
  bring_in:        {t:"Brought roster flights into the logbook", k:"acc", i:"↓"},
  logbook_import:  {t:"Imported an old logbook",       k:"acc",i:"↓"},
  logbook_import_failed:{t:"Old logbook import failed",k:"bad",i:"!"},
  flight_saved:    {t:"Saved a flight",                k:"",   i:"✓"},
  pdf_export:      {t:"Made a logbook PDF",            k:"",   i:"⇩"},
  airline_request: {t:"Asked for their airline",       k:"acc",i:"?"},
  compare:         {t:"Compared rosters",              k:"",   i:"⇄"},
  swap_request:    {t:"Asked for a swap",              k:"acc",i:"⇄"},
  error:           {t:"Error",                         k:"bad",i:"!"},
  quiet_error:     {t:"Something failed quietly",      k:"bad",i:"!"}
};
function kindOf(k){ return KINDS[k] || {t:k.replace(/_/g," "), k:"", i:"·"}; }

/* ---------- tiny helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=n=>(+n||0).toLocaleString("en-US");
const hm=m=>{ m=Math.max(0,Math.round(+m||0)); return num(Math.floor(m/60))+":"+String(m%60).padStart(2,"0"); };
function ago(t){
  if(!t) return "never"; const s=(Date.now()-new Date(t).getTime())/1000;
  if(s<60) return "just now"; if(s<3600) return Math.round(s/60)+" min ago";
  if(s<86400) return Math.round(s/3600)+" h ago"; if(s<86400*14) return Math.round(s/86400)+" d ago";
  return new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
}
const hhmm=t=>new Date(t).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
const dshort=d=>new Date(d+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});

/* ---------- the server ---------- */
function sess(){ try{ return JSON.parse(localStorage.getItem(SESS_KEY)||"null"); }catch(e){ return null; } }
function setSess(s){ try{ s?localStorage.setItem(SESS_KEY,JSON.stringify(s)):localStorage.removeItem(SESS_KEY); }catch(e){} }
async function signIn(email, password){
  const r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",
    headers:{"apikey":SB_KEY,"Content-Type":"application/json"}, body:JSON.stringify({email,password})});
  const b=await r.json().catch(()=>({}));
  if(!r.ok || !b.access_token) throw new Error(b.error_description||b.msg||"Could not sign in.");
  b.expires_at_ms=Date.now()+(+b.expires_in||3600)*1000; setSess(b); return b;
}
async function renew(){
  const s=sess(); if(!s||!s.refresh_token) return null;
  const r=await fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",
    headers:{"apikey":SB_KEY,"Content-Type":"application/json"}, body:JSON.stringify({refresh_token:s.refresh_token})});
  if(!r.ok){ if(r.status>=400&&r.status<500) setSess(null); return null; }
  const b=await r.json(); b.expires_at_ms=Date.now()+(+b.expires_in||3600)*1000; setSess(b); return b;
}
async function rpc(fn, args){
  let s=sess(); if(!s) throw new Error("signed out");
  if(Date.now() > (s.expires_at_ms||0)-60000) s=await renew()||s;
  const call=()=>fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:{"apikey":SB_KEY,"Authorization":"Bearer "+(sess()||{}).access_token,"Content-Type":"application/json"},
    body:JSON.stringify(args||{})});
  let r=await call();
  if(r.status===401){ if(await renew()) r=await call(); else throw new Error("signed out"); }
  if(!r.ok){ const b=await r.json().catch(()=>({})); const e=new Error(b.message||("HTTP "+r.status)); e.code=b.code; throw e; }
  return r.json();
}
/* A function the server does not have yet is not an error on this page: it is
   "run part NN". Everything else says what went wrong. */
async function tryRpc(fn, args, fallback){
  try{ return await rpc(fn,args); }
  catch(e){ if(/does not exist|PGRST202|42883|Could not find/i.test(String(e.message)+e.code)) { S.missing.add(fn); return fallback; } throw e; }
}

/* ---------- state ---------- */
const S={sum:null, daily:[], online:[], events:[], errors:[], screens:[], funnel:[], pilots:[], requests:[],
         missing:new Set(), view:"", kind:"", q:"", chart:"active", loadedAt:0, err:"", pilot:null, timer:null};

async function load(){
  if(DEMO){ demoData(); draw(); return; }
  try{
    const [sum,daily,online,events,errors,screens,funnel,pilots,requests]=await Promise.all([
      tryRpc("admin_cr_summary",{},[]), tryRpc("admin_cr_daily",{p_days:60},[]), tryRpc("admin_cr_online",{p_minutes:15},[]),
      tryRpc("admin_cr_events",{p_limit:300},[]), tryRpc("admin_cr_errors",{p_days:14},[]), tryRpc("admin_cr_screens",{p_days:7},[]),
      tryRpc("admin_cr_funnel",{},[]), tryRpc("admin_cr_pilots",{},[]), tryRpc("admin_airline_requests",{},[])]);
    Object.assign(S,{sum:(sum||[])[0]||null, daily, online, events, errors, screens, funnel, pilots, requests, err:"", loadedAt:Date.now()});
  }catch(e){
    if(/signed out/.test(e.message)){ setSess(null); draw(); return; }
    S.err=e.message;
  }
  draw();
}
/* Every 20 seconds for who is online and what just happened; the rest with it. */
function startLive(){ clearInterval(S.timer); S.timer=setInterval(()=>{ if(!document.hidden && (sess()||DEMO)) load(); }, 20000); }

/* ============================================================================
   DRAWING
   ========================================================================= */
function draw(){
  const root=$("#root");
  if(!DEMO && !sess()){ root.innerHTML=gateHtml(); wireGate(); return; }
  if(S.sum===null && !S.err && !DEMO && !S.loadedAt){ root.innerHTML=`<div class="wrap"><div class="empty">Loading…</div></div>`; return; }
  const keepScroll=[...document.querySelectorAll(".scroll")].map(x=>x.scrollTop);
  root.innerHTML=`<div class="wrap">
    ${headerHtml()}
    ${S.err?`<div class="card" style="margin-bottom:14px;border-color:var(--bad)"><b>Couldn't load:</b> ${esc(S.err)}</div>`:""}
    ${S.missing.size?`<div class="card" style="margin-bottom:14px"><b>Some panels need the database updated.</b>
      <span class="muted">Run SQL part 38 in Supabase (and part 37 for airline requests), then reload. Missing: ${esc([...S.missing].join(", "))}</span></div>`:""}
    <div class="grid">
      <section class="card c8" aria-labelledby="hKpi"><h2 id="hKpi">Right now</h2><div class="cap">${S.loadedAt?"Updated "+hhmm(S.loadedAt):""}${DEMO?" · made-up data":""}</div>${kpiHtml()}</section>
      <section class="card c4" style="grid-row:span 2" aria-labelledby="hMap"><h2 id="hMap">The app, first screen to last</h2>
        <div class="cap">Online now on each screen, and pilots who opened it in the last 7 days. Click one to filter the activity.</div>${mapHtml()}</section>
      <section class="card c8" aria-labelledby="hTrend"><h2 id="hTrend">${({active:"Active pilots",signups:"Sign-ups",errors:"Errors",imports:"Roster imports"})[S.chart]} per day</h2>
        <div class="cap">Last 60 days</div>
        <div class="tabs" role="tablist">${[["active","Active pilots"],["signups","Sign-ups"],["imports","Roster imports"],["errors","Errors"]].map(([k,l])=>
          `<button role="tab" aria-selected="${S.chart===k}" class="${S.chart===k?"on":""}" onclick="S.chart='${k}';draw()">${l}</button>`).join("")}</div>
        <div class="chart" id="trend">${trendSvg()}</div></section>

      <section class="card c5" aria-labelledby="hOn"><h2 id="hOn">Online now</h2><div class="cap">${S.online.filter(o=>live(o)).length} in the app · seen in the last 15 minutes below</div>${onlineHtml()}</section>

  (S.events||[]).filter(e=>e.kind==="logbook_import_failed").slice(0,8).forEach(e=>out.push({at:e.at, dot:"bad", uid:e.user_id,
    t:`${esc(e.pilot)}'s old logbook would not import`, s:esc(((e.data||{}).reason||"")+((e.data||{}).format?" · "+(e.data||{}).format:""))}));
  (S.events||[]).filter(e=>e.kind==="import_empty"||e.kind==="import_failed").slice(0,8).forEach(e=>out.push({at:e.at, dot:"bad", uid:e.user_id,

  else Object.keys(d).slice(0,3).forEach(k=>b.push(k+": "+String(d[k]).slice(0,40)));

/* ---------- the trend chart (one series, one axis) ---------- */
function trendSvg(){
  const rows=S.daily||[]; if(!rows.length) return `<div class="empty">No data yet.</div>`;
  const key=S.chart, vals=rows.map(r=>+r[key]||0), max=Math.max(1,...vals);
  const W=760, H=220, L=34, R=8, T=10, B=24, iw=W-L-R, ih=H-T-B, n=rows.length, bw=iw/n;
  const nice=niceMax(max), ticks=[0,nice/2,nice];
  const color = key==="errors" ? "var(--series-bad)" : "var(--series)";
  const y=v=>T+ih-(v/nice)*ih;
  let g=ticks.map(t=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L-6}" y="${y(t)+3.5}" text-anchor="end">${num(t)}</text>`).join("");
  const step=Math.ceil(n/8);
  g+=rows.map((r,i)=>i%step===0||i===n-1?`<text class="ax" x="${L+bw*i+bw/2}" y="${H-6}" text-anchor="middle">${dshort(String(r.day).slice(0,10))}</text>`:"").join("");
  let marks="";
  if(key==="active"){
    const pts=vals.map((v,i)=>[L+bw*i+bw/2, y(v)]);
    marks=`<path d="${pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("")}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
      +`<circle cx="${pts[n-1][0]}" cy="${pts[n-1][1]}" r="4" fill="${color}" stroke="var(--card)" stroke-width="2"/>`;
  } else {
    marks=vals.map((v,i)=>{ if(!v) return ""; const x=L+bw*i+1, w=Math.max(1,bw-2), h=Math.max(2,(v/nice)*ih), r=Math.min(4,w/2,h);
      const yy=T+ih-h; return `<path fill="${color}" d="M${x} ${T+ih}V${yy+r}Q${x} ${yy} ${x+r} ${yy}H${x+w-r}Q${x+w} ${yy} ${x+w} ${yy+r}V${T+ih}Z"/>`; }).join("");
  }
  const hits=rows.map((r,i)=>`<rect class="hit" x="${L+bw*i}" y="${T}" width="${bw}" height="${ih}" data-i="${i}"/>`).join("");
  const last=vals[n-1], tot=vals.reduce((a,b)=>a+b,0);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(key)} per day, last ${n} days. Today ${last}, total ${tot}.">${g}${marks}
    <line id="xh" class="gl" x1="0" x2="0" y1="${T}" y2="${T+ih}" style="display:none;stroke:var(--faint)"/>${hits}</svg>
    <div class="faint" style="font-size:12px;margin-top:4px">Today <b style="color:var(--ink)">${num(last)}</b> · ${n} days <b style="color:var(--ink)">${num(tot)}</b>${key==="active"?" pilot-days":""}</div>`;
}
function niceMax(v){ const p=Math.pow(10,Math.floor(Math.log10(Math.max(1,v)))); for(const m of [1,2,2.5,5,10]) if(m*p>=v) return m*p; return 10*p; }
function wireChart(){
  const tip=$("#tip"), svg=document.querySelector("#trend svg"); if(!svg) return;
  const rows=S.daily||[], key=S.chart, xh=svg.querySelector("#xh");
  const L=34, R=8, W=760, bw=(W-L-R)/rows.length;
  svg.querySelectorAll(".hit").forEach(h=>{
    h.addEventListener("mousemove",ev=>{ const i=+h.dataset.i, r=rows[i];
      tip.innerHTML=`${dshort(String(r.day).slice(0,10))} · <b>${num(r[key])}</b> ${({active:"active pilots",signups:"sign-ups",errors:"errors",imports:"roster imports"})[key]}`;
      tip.style.display="block"; tip.style.left=ev.clientX+"px"; tip.style.top=ev.clientY+"px";
      xh.style.display=""; const x=L+bw*i+bw/2; xh.setAttribute("x1",x); xh.setAttribute("x2",x); });
    h.addEventListener("mouseleave",()=>{ tip.style.display="none"; xh.style.display="none"; });
  });
}

  const cur=document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const next=cur==="dark"?"light":"dark"; document.documentElement.setAttribute("data-theme",next);
  try{ localStorage.setItem("rvcr_theme",next); }catch(e){}
}
try{ const t=localStorage.getItem("rvcr_theme"); if(t) document.documentElement.setAttribute("data-theme",t); }catch(e){}
